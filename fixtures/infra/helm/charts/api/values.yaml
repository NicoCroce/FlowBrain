replicaCount: 2
image:
  repository: registry.example.com/catalogo
  tag: ""
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
ingress:
  enabled: true
  hosts:
    - host: catalogo.example.com
      paths:
        - path: /catalogo
          pathType: Prefix
env:
  - name: REDIS_URL
    value: redis://redis:6379
  - name: API_KEY
    value: clave-de-values
