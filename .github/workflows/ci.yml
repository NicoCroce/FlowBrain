name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Armar el paquete y probarlo instalado
        run: |
          pnpm build
          cd packages/flowbrain && npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/inst" && cd "$RUNNER_TEMP/inst" && npm init -y >/dev/null
          npm install "$RUNNER_TEMP"/flowbrain-*.tgz
          ./node_modules/.bin/flowbrain --version
          ./node_modules/.bin/flowbrain help >/dev/null
